# This workflow is structured to match the provided "Gaming Agents API" example.
#activate
name: 🚀 Deploy FastAPI Image Gen to Cloud Run

on:
  push:
    branches: [ main ]

jobs:
  deploy-fastapi-imagegen:
    name: 🚀 Deploy FastAPI Image Gen API
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: cvoapi
          export_default_credentials: true

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: 🐳 Configure Docker to use gcloud
        # This command matches the provided example.
        run: gcloud auth configure-docker

      - name: 🛠️ Build and Push Docker Image
        # This build command matches the provided example.
        run: |
          docker buildx create --use || true
          docker buildx build --push --platform linux/amd64 \
            -f Dockerfile \
            -t gcr.io/cvoapi/fastapi-imagegen:${{ github.sha }} .

      - name: 🚢 Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: fastapi-imagegen
          image: gcr.io/cvoapi/fastapi-imagegen:${{ github.sha }}
          region: us-central1
          
          # --- FIX: Moved all settings into the 'flags' input ---
          flags: --allow-unauthenticated --memory=16Gi --cpu=4
          
          # --- FIX: Added a timeout to allow the service more time to start ---
          timeout: 10m

          # The application should use the service's built-in identity.
          env_vars: |
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
            IMAGE_SERVER_BASE=https://fastapi-imagegen-2l5aaarlka-uc.a.run.app

      - name: 🌐 Print Deployed URL
        # This manual URL print command matches the provided example.
        run: |
          URL=$(gcloud run services describe fastapi-imagegen \
            --region=us-central1 \
            --format='value(status.url)')
          echo "✅ Service deployed at: $URL"
