name: Deploy to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 🔍 Debug step to test SSH connection
      - name: Test SSH Connection
        run: |
          echo "🔍 Testing SSH connection..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "echo '✅ SSH connection successful'"

      # 🚀 Actual deployment
      - name: Deploy to VM
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            set -e  # Exit on first error

            echo "🚀 Starting deployment on VM at $(date)"

            echo "➡️ Navigating to NoviBE directory"
            cd ~/NoviBE

            echo "➡️ Pulling latest code from main branch"
            git fetch origin main
            git reset --hard origin/main

            echo "➡️ Activating virtual environment"
            cd MM2
            source venv/bin/activate

            echo "➡️ Upgrading pip"
            pip install --upgrade pip

            echo "➡️ Installing requirements"
            pip install -r requirements.txt

            echo "➡️ Restarting novibe.service"
            sudo systemctl restart novibe.service

            echo "✅ Deployment completed successfully at $(date)"
          EOF
